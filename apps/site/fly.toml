# The V1 website; deploy from apps/site. The root Fly config remains the historical Rust platform.
app = 'gigacouch-platform'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  HOSTNAME = '0.0.0.0'
  DATA_DIR = '/data/site'
  SITE_ORIGIN = 'https://gigacouch-platform.fly.dev'
  GAMES_ORIGIN = 'https://gigacouch-games.fly.dev'
  COOKIE_SECURE = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[mounts]]
  source = 'gigacouch_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

server {
    listen 8080;
    server_name _;
    # Reject encoded path separators/traversal before nginx normalizes the URI for location matching.
    if ($request_uri ~* "(%2e|%2f|%5c|/\.\./)") { return 404; }
    location = /health { return 200 'ok'; }
    # Fly replays the original request (including the games Host) to the same site machine and volume.
    # Only public game files are routed here. Account pages and mutation endpoints are never replayed.
    location /g/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header fly-replay 'app=gigacouch-platform' always;
        return 204;
    }
    location / { return 307 https://gigacouch-platform.fly.dev; }
}

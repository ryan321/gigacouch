<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Controller Gallery</title>
    <link rel="stylesheet" href="gallery.css">
  </head>
  <body>
    <main id="gallery">
      <header class="top">
        <div class="now">
          <p class="eyebrow">Controller Gallery</p>
          <h1 id="layout-name">Stick and two buttons</h1>
          <p id="layout-about" class="about"></p>
          <ul id="sounds" class="sounds" aria-label="Sounds on the phones"></ul>
          <p id="how" class="how"></p>
        </div>
        <aside id="join" class="join" hidden>
          <div id="join-qr" class="qr"></div>
          <p>Scan to join<br><span id="join-url"></span></p>
        </aside>
      </header>
      <ol id="strip" class="strip" aria-label="Phone layouts"></ol>
      <section id="players" class="players" aria-live="polite"></section>
    </main>
    <script src="gallery.js"></script>
  </body>
</html>
